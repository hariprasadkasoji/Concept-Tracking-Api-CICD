name: Build and Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Python
        run: py --version

      - name: Install dependencies
        run: py -m pip install -r requirements.txt

      - name: Check syntax
        run: py -m py_compile main.py

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: write        # required to push tags and create releases
    environment: development   # <-- pulls secrets from this Environment
    timeout-minutes: 15        # hard ceiling so a hang never runs for hours

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0       # full history so tags are available
          fetch-tags: true

      - name: Determine next version from tags
        # Computed BEFORE the deploy so version.py can be stamped with the
        # number this build will carry. The tag itself is only pushed after
        # the health check passes - a failed deploy never gets a version.
        shell: powershell
        run: |
          git fetch --tags --force
          $tags = git tag --list "v*.*.*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }
          if ($tags) {
            $latest = $tags | Sort-Object { [version]($_ -replace '^v','') } | Select-Object -Last 1
          } else {
            $latest = "v0.0.0"
          }
          $latest -match '^v(\d+)\.(\d+)\.(\d+)$' | Out-Null
          $newVersion = "v$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          Write-Host "Latest tag: $latest -> deploying as $newVersion"
          "NEW_VERSION=$newVersion" >> $env:GITHUB_ENV

      - name: Stamp build version
        # Injects version/SHA/date into version.py BEFORE the robocopy copy,
        # so the deployed code (and the release zip below) carries it.
        # This is what makes the health check able to prove WHICH build
        # is answering - see /version in main.py.
        shell: powershell
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0,7)
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $versionFile = "version.py"

          (Get-Content $versionFile) `
            -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$env:NEW_VERSION`"" `
            -replace 'BUILD_SHA = ".*"', "BUILD_SHA = `"$shortSha`"" `
            -replace 'BUILD_DATE = ".*"', "BUILD_DATE = `"$buildDate`"" `
            -replace 'BUILD_BRANCH = ".*"', "BUILD_BRANCH = `"main`"" |
            Set-Content $versionFile

          Write-Host "Stamped $versionFile as $env:NEW_VERSION ($shortSha)"

      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          $appPool = "CONCEPT-TRACKING-API-CICD"
          $state = (Get-WebAppPoolState -Name $appPool).Value
          if ($state -eq "Started") {
              Stop-WebAppPool -Name $appPool
              Write-Host "Waiting for app pool to stop..."
              do {
                  Start-Sleep -Seconds 2
                  $state = (Get-WebAppPoolState -Name $appPool).Value
                  Write-Host "Current state: $state"
              } while ($state -ne "Stopped")
              Write-Host "App pool stopped successfully."
          }
          else {
              Write-Host "App pool already stopped."
          }

      - name: Copy backend files
        shell: powershell
        run: |
          # /XD iislogs is required: /MIR mirrors the repo onto the target and
          # would DELETE the server's iislogs folder (it is not in the repo),
          # wiping every log written since the last deploy.
          robocopy `
            "$env:GITHUB_WORKSPACE" `
            "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD" `
            /MIR `
            /XD venv .git __pycache__ iislogs `
            /XF .env

          if ($LASTEXITCODE -ge 8) {
              exit 1
          }
          else {
              exit 0
          }

      - name: Create .env file from secrets
        shell: powershell
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          $secretsJson = $env:SECRETS_JSON | ConvertFrom-Json
          $envPath = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\.env"

          $lines = @()
          foreach ($prop in $secretsJson.PSObject.Properties) {
              if ($prop.Name -ne "github_token") {
                  $lines += "$($prop.Name)=$($prop.Value)"
              }
          }

          # Use UTF8 WITHOUT BOM to avoid corrupting the first key
          [System.IO.File]::WriteAllLines($envPath, $lines, [System.Text.UTF8Encoding]::new($false))

          Write-Host ".env file written with $($lines.Count) variables."

      - name: Validate .env has required keys
        shell: powershell
        run: |
          $envPath = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\.env"
          $requiredKeys = @(
              "AUTH_SECRET_KEY",
              "AUTH_ALGORITHM",
              "ACCESS_TOKEN_EXPIRE_MINUTES",
              "DB_DRIVER",
              "DB_HOST",
              "DB_USER",
              "DB_PASSWORD",
              "DB_NAME"
          )

          $envContent = Get-Content $envPath
          $missing = @()

          foreach ($key in $requiredKeys) {
              $found = $envContent | Where-Object { $_ -match "^$key=" }
              if (-not $found) {
                  $missing += $key
              }
          }

          if ($missing.Count -gt 0) {
              Write-Host "Missing required keys in .env:"
              $missing | ForEach-Object { Write-Host "  - $_" }
              Write-Host "Check the secret names in the 'development' Environment match exactly."
              exit 1
          }

          Write-Host "All required keys present in .env."

      - name: Ensure IIS logs folder exists
        shell: powershell
        run: |
          $logFolder = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\iislogs"
          if (!(Test-Path $logFolder)) {
              New-Item -ItemType Directory -Path $logFolder | Out-Null
              Write-Host "Created iislogs folder."
          }
          else {
              Write-Host "iislogs folder already exists."
          }

      - name: Create virtual environment if needed
        shell: powershell
        working-directory: C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD
        run: |
          if (!(Test-Path ".\venv")) {
            py -m venv venv
          }

      - name: Install dependencies
        shell: powershell
        working-directory: C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD
        run: |
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Start IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-Sleep -Seconds 3
          Start-WebAppPool -Name "CONCEPT-TRACKING-API-CICD"
          Write-Host "App pool started."

      - name: Health Check
        # Two questions, like the reference pipeline:
        #   /version  is this the build we just deployed? (verified by SHA)
        #   /docs     can it actually serve?
        # /docs alone cannot distinguish the new process from a stale one,
        # and a 200 from /version alone would not prove the app works.
        shell: powershell
        run: |
          $expectedSha = $env:GITHUB_SHA.Substring(0,7)
          $maxAttempts = 30
          $healthy = $false
          $startTime = Get-Date
          $lastSeenSha = $null

          foreach ($i in 1..$maxAttempts) {
              $elapsed = [math]::Round(((Get-Date) - $startTime).TotalSeconds, 1)

              # Question 1: which build is answering?
              $sha = $null
              try {
                  $body = curl.exe -k -s --max-time 5 --connect-timeout 3 https://localhost:6400/version
                  if ($body) { $sha = ($body | ConvertFrom-Json).sha }
              } catch { }

              if ($sha -ne $expectedSha) {
                  if ($sha -and $sha -ne $lastSeenSha) {
                      Write-Host "Attempt $i/$maxAttempts (${elapsed}s): serving '$sha' - waiting for '$expectedSha'"
                      $lastSeenSha = $sha
                  } else {
                      Write-Host "Attempt $i/$maxAttempts (${elapsed}s): no version response yet (last: '$lastSeenSha')"
                  }
                  Start-Sleep -Seconds 5
                  continue
              }

              # Question 2: can it serve?
              $response = curl.exe -k -s -o NUL -w "%{http_code}" --max-time 5 --connect-timeout 3 https://localhost:6400/docs
              Write-Host "Attempt $i/$maxAttempts (${elapsed}s): build $expectedSha up, /docs returned HTTP $response"

              if ($response -eq "200") {
                  Write-Host "Backend is healthy after ${elapsed}s."
                  $healthy = $true
                  break
              }
              Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
              Write-Host "Health check failed after $maxAttempts attempts."
              if ($lastSeenSha -and $lastSeenSha -ne $expectedSha) {
                  Write-Host "Never saw build $expectedSha - last response came from $lastSeenSha."
                  Write-Host "The new process did not take over (check web.config / venv path / app pool identity)."
              }
              $logFolder = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\iislogs"
              $latestLog = Get-ChildItem -Path $logFolder -Filter "fastapi_*.log" -ErrorAction SilentlyContinue |
                           Sort-Object LastWriteTime -Descending |
                           Select-Object -First 1

              if ($latestLog) {
                  Write-Host "Showing tail of: $($latestLog.FullName)"
                  Get-Content $latestLog.FullName -Tail 50
              } else {
                  Write-Host "No log files found matching 'fastapi_*.log' in $logFolder."
                  Write-Host "This likely means httpPlatformHandler never started the process at all."
                  Write-Host "Check: app pool identity permissions on venv/log folder, port binding conflicts, or a bad python.exe path in web.config."
              }
              exit 1
          }

      - name: Tag release
        # Only reached when the health check passed - a failed deploy
        # never consumes a version number or creates a tag.
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$env:NEW_VERSION" -m "Release of $env:NEW_VERSION"
          git push origin "$env:NEW_VERSION"

      - name: Package deploy artifact
        shell: powershell
        run: |
          $staging = "$env:RUNNER_TEMP\release\ConceptTrackingApi"
          if (Test-Path "$env:RUNNER_TEMP\release") {
              Remove-Item "$env:RUNNER_TEMP\release" -Recurse -Force
          }
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          robocopy "$env:GITHUB_WORKSPACE" $staging /E `
            /XD venv .venv .git __pycache__ .pytest_cache iislogs `
            /XF .env *.log *.pyc
          if ($LASTEXITCODE -ge 8) { exit 1 }

          $zip = "$env:RUNNER_TEMP\ConceptTrackingApi-$env:NEW_VERSION.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -Force
          Write-Host "Packaged $zip"

          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV
          exit 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: ${{ env.NEW_VERSION }}
          generate_release_notes: true
          body: |
            Release of ${{ env.NEW_VERSION }}

            Commit: ${{ github.sha }}

            `ConceptTrackingApi-${{ env.NEW_VERSION }}.zip` is the exact code deployed to the
            development environment, with `version.py` already stamped. Deploy this artifact
            for UAT - do not use the auto-generated "Source code" zip, its version is stale.
          files: ${{ env.RELEASE_ZIP }}