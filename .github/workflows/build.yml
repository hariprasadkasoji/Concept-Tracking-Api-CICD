name: Build and Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Python
        run: py --version

      - name: Install dependencies
        run: py -m pip install -r requirements.txt

      - name: Check syntax
        run: py -m py_compile main.py

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: write        # required to push tags
    environment: development   # <-- pulls secrets from this Environment
    timeout-minutes: 15        # hard ceiling so a hang never runs for hours

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0       # full history so tags are available

      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          $appPool = "CONCEPT-TRACKING-API-CICD"
          $state = (Get-WebAppPoolState -Name $appPool).Value
          if ($state -eq "Started") {
              Stop-WebAppPool -Name $appPool
              Write-Host "Waiting for app pool to stop..."
              do {
                  Start-Sleep -Seconds 2
                  $state = (Get-WebAppPoolState -Name $appPool).Value
                  Write-Host "Current state: $state"
              } while ($state -ne "Stopped")
              Write-Host "App pool stopped successfully."
          }
          else {
              Write-Host "App pool already stopped."
          }

      - name: Copy backend files
        shell: powershell
        run: |
          robocopy `
            "$env:GITHUB_WORKSPACE" `
            "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD" `
            /MIR `
            /XD venv .git __pycache__ `
            /XF .env

          if ($LASTEXITCODE -ge 8) {
              exit 1
          }
          else {
              exit 0
          }

      - name: Create .env file from secrets
        shell: powershell
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          $secretsJson = $env:SECRETS_JSON | ConvertFrom-Json
          $envPath = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\.env"
      
          $lines = @()
          foreach ($prop in $secretsJson.PSObject.Properties) {
              if ($prop.Name -ne "github_token") {
                  $lines += "$($prop.Name)=$($prop.Value)"
              }
          }
      
          # Use UTF8 WITHOUT BOM to avoid corrupting the first key
          [System.IO.File]::WriteAllLines($envPath, $lines, [System.Text.UTF8Encoding]::new($false))
      
          Write-Host ".env file written with $($lines.Count) variables."

      - name: Validate .env has required keys
        shell: powershell
        run: |
          $envPath = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\.env"
          $requiredKeys = @(
              "AUTH_SECRET_KEY",
              "AUTH_ALGORITHM",
              "ACCESS_TOKEN_EXPIRE_MINUTES",
              "DB_DRIVER",
              "DB_HOST",
              "DB_USER",
              "DB_PASSWORD",
              "DB_NAME"
          )

          $envContent = Get-Content $envPath
          $missing = @()

          foreach ($key in $requiredKeys) {
              $found = $envContent | Where-Object { $_ -match "^$key=" }
              if (-not $found) {
                  $missing += $key
              }
          }

          if ($missing.Count -gt 0) {
              Write-Host "Missing required keys in .env:"
              $missing | ForEach-Object { Write-Host "  - $_" }
              Write-Host "Check the secret names in the 'development' Environment match exactly."
              exit 1
          }

          Write-Host "All required keys present in .env."

      - name: Ensure IIS logs folder exists
        shell: powershell
        run: |
          $logFolder = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\iislogs"
          if (!(Test-Path $logFolder)) {
              New-Item -ItemType Directory -Path $logFolder | Out-Null
              Write-Host "Created iislogs folder."
          }
          else {
              Write-Host "iislogs folder already exists."
          }

      - name: Create virtual environment if needed
        shell: powershell
        working-directory: C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD
        run: |
          if (!(Test-Path ".\venv")) {
            py -m venv venv
          }

      - name: Install dependencies
        shell: powershell
        working-directory: C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD
        run: |
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Start IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-Sleep -Seconds 3
          Start-WebAppPool -Name "CONCEPT-TRACKING-API-CICD"
          Write-Host "App pool started."

      - name: Health Check
        shell: powershell
        run: |
          $maxAttempts = 30
          $healthy = $false
          $startTime = Get-Date

          foreach ($i in 1..$maxAttempts) {
              try {
                  # --max-time / --connect-timeout bound each call so a hung
                  # backend can't stall this loop for minutes per attempt.
                  $response = curl.exe -k -s -o NUL -w "%{http_code}" --max-time 5 --connect-timeout 3 https://localhost:6400/docs
              } catch {
                  $response = "ERR"
              }

              $elapsed = [math]::Round(((Get-Date) - $startTime).TotalSeconds, 1)
              Write-Host "Attempt $i/$maxAttempts (${elapsed}s elapsed): HTTP $response"

              if ($response -eq "200") {
                  Write-Host "Backend is healthy after ${elapsed}s."
                  $healthy = $true
                  break
              }
              Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
              Write-Host "Health check failed after $maxAttempts attempts."
              $logFolder = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\iislogs"
              $latestLog = Get-ChildItem -Path $logFolder -Filter "fastapi_*.log" -ErrorAction SilentlyContinue |
                           Sort-Object LastWriteTime -Descending |
                           Select-Object -First 1

              if ($latestLog) {
                  Write-Host "Showing tail of: $($latestLog.FullName)"
                  Get-Content $latestLog.FullName -Tail 50
              } else {
                  Write-Host "No log files found matching 'fastapi_*.log' in $logFolder."
                  Write-Host "This likely means httpPlatformHandler never started the process at all."
                  Write-Host "Check: app pool identity permissions on venv/log folder, port binding conflicts, or a bad python.exe path in web.config."
              }
              exit 1
          }

      - name: Increment version tag and push
        shell: powershell
        run: |
          git fetch --tags origin

          $latest = git tag --sort=-v:refname | Select-Object -First 1
          if (-not $latest) {
              $latest = "v0.0.0"
          }
          Write-Host "Latest tag: $latest"

          $ver = $latest.TrimStart('v')
          $parts = $ver.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1
          $newTag = "v$major.$minor.$patch"
          Write-Host "New tag: $newTag"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag $newTag
          git push origin $newTag
          Write-Host "Pushed tag $newTag"
