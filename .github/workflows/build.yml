name: Build and Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Python
        run: py --version

      - name: Install dependencies
        run: py -m pip install -r requirements.txt

      - name: Check syntax
        run: py -m py_compile main.py

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v5

      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
      
          $appPool = "CONCEPT-TRACKING-API-CICD"
      
          $state = (Get-WebAppPoolState -Name $appPool).Value
      
          if ($state -eq "Started") {
      
              Stop-WebAppPool -Name $appPool
      
              Write-Host "Waiting for app pool to stop..."
      
              do {
                  Start-Sleep -Seconds 2
                  $state = (Get-WebAppPoolState -Name $appPool).Value
                  Write-Host "Current state: $state"
      
              } while ($state -ne "Stopped")
      
              Write-Host "App pool stopped successfully."
          }
          else {
              Write-Host "App pool already stopped."
          }

      - name: Copy backend files
        shell: powershell
        run: |
          robocopy `
            "$env:GITHUB_WORKSPACE" `
            "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD" `
            /MIR `
            /XD venv .git __pycache__ `
            /XF .env

          if ($LASTEXITCODE -ge 8) {
              exit 1
          }
          else {
              exit 0
          }
      - name: Ensure IIS logs folder exists
        shell: powershell
        run: |
          $logFolder = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\iislogs"
      
          if (!(Test-Path $logFolder)) {
              New-Item -ItemType Directory -Path $logFolder | Out-Null
              Write-Host "Created iislogs folder."
          }
          else {
              Write-Host "iislogs folder already exists."
          }

      - name: Create virtual environment if needed
        shell: powershell
        working-directory: C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD
        run: |
          if (!(Test-Path ".\venv")) {
            py -m venv venv
          }
      
      - name: Install dependencies
        shell: powershell
        working-directory: C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD
        run: |
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Start IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
      
          Start-Sleep -Seconds 3
      
          Start-WebAppPool -Name "CONCEPT-TRACKING-API-CICD"
      
          Write-Host "App pool started."

      - name: Health Check
        shell: powershell
        run: |
          $maxAttempts = 30
          $healthy = $false
          foreach ($i in 1..$maxAttempts) {
              try {
                  $response = curl.exe -k -s -o NUL -w "%{http_code}" https://localhost:6400/docs
                  if ($response -eq "200") {
                      Write-Host "Backend is healthy."
                      $healthy = $true
                      break
                  }
              } catch {}
              Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
              Write-Host "Health check failed."
              $logFolder = "C:\apps\concept-tracking-CICD\api\Concept-Tracking-Api-CICD\iislogs"
              $latestLog = Get-ChildItem -Path $logFolder -Filter "fastapi_*.log" -ErrorAction SilentlyContinue |
                           Sort-Object LastWriteTime -Descending |
                           Select-Object -First 1

              if ($latestLog) {
                  Write-Host "Showing tail of: $($latestLog.FullName)"
                  Get-Content $latestLog.FullName -Tail 50
              } else {
                  Write-Host "No log files found matching 'fastapi_*.log' in $logFolder."
                  Write-Host "This likely means httpPlatformHandler never started the process at all."
                  Write-Host "Check: app pool identity permissions on venv/log folder, port binding conflicts, or a bad python.exe path in web.config."
              }
              exit 1
          }
